<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=0">
    <script>
        window.onload = function () {
            document.addEventListener('touchstart', function (event) {
                if (event.touches.length > 1) {
                    event.preventDefault()
                }
            })
            document.addEventListener('gesturestart', function (event) {
                event.preventDefault()
            })
        }
    </script>
    <title>
        <%= htmlWebpackPlugin.options.title %>
    </title>

    <% for (var css in htmlWebpackPlugin.files.css) { %>
    <link href="./<%=htmlWebpackPlugin.files.css[css] %>" rel="stylesheet" type="text/css" />
    <% } %>


</head>

<body style="background-color: gray;">
    <div style="width: 100%;height: 100%;overflow: hidden;" id="app"></div>
    <!--导入 Webpack 输出的 JavaScript 文件-->
    <% for (var chunk in htmlWebpackPlugin.files.js) { %>
    <script type="text/javascript" src="./<%=htmlWebpackPlugin.files.js[chunk] %>"></script>
    <% } %>
</body>

</html>
